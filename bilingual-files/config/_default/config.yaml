title: Eliany Perez
baseURL: https://elianyperez.netlify.app/
languageCode: en-us
defaultContentLanguage: en
enableRobotsTXT: true
disableHugoGeneratorInject: true
summaryLength: 35
paginate: 12
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
taxonomies:
  tag: tags
  category: categories
permalinks:
  tags: /tag/:slug/
  categories: /category/:slug/
markup:
  goldmark:
    renderer:
      unsafe: false

defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: English
    languageCode: en-us
    contentDir: content
    weight: 1
  es:
    languageName: Español
    languageCode: es
    contentDir: content-es
    weight: 2
